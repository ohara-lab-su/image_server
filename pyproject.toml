[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-server-kit"

version = "0.0.3"

description = "Reusable Python template for camera-independent image acquisition and gRPC streaming, with server and viewer components."
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "xlogger-py",
    #
    "pyserial",
    "nest_asyncio",
    "pydantic",
    "pyyaml",
    "pytest",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/image_server/"
Documentation = "https://ohara-lab-su.github.io/image_server/"
Repository = "https://github.com/ohara-lab-su/image_server"
Issues = "https://github.com/ohara-lab-su/image_server/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"